<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title data-i18n="title.settings">BlankRun Settings</title>
<link rel="stylesheet" href="nb.css"><link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="window">
  <aside class="side">
    <nav class="nav">
      <a href="#general" data-i18n="nav.general"></a>
      <a href="#blank" data-i18n="nav.blank"></a>
      <a href="#wake" data-i18n="nav.wake"></a>
      <a href="#schedule" data-i18n="nav.schedule"></a>
      <div class="sep"></div>
      <a href="#about" data-i18n="nav.about"></a>
    </nav>
  </aside>

  <main class="main">

  <!-- 通用 -->
  <section id="general">
    <h1 data-i18n="g.title"></h1>
    <p class="lead" data-i18n="g.lead"></p>
    <p class="notice" id="trayHidden" hidden data-i18n="g.tray_hidden"></p>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="g.launch"></span><small data-i18n="g.launch_note"></small></div><div class="c"><button class="toggle" role="switch" data-k="general.launch_at_login"></button></div></div>
      <div class="r"><div class="t"><span data-i18n="g.lang"></span></div><div class="c"><span class="select"><select data-k="general.language" id="langSel"></select></span></div></div>
      <div class="r"><div class="t"><span data-i18n="g.hotkey"></span><small data-i18n="g.hotkey_note"></small><small class="err" id="hkErr" hidden></small></div><div class="c"><span class="recorder" data-hk="general.blank_now_hotkey"><span class="keys"></span><button class="x" data-i18n="rec.again"></button></span></div></div>
    </div>
    <div class="group-label"><span data-i18n="g.awake_label"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="g.awake"></span><small data-i18n="g.awake_note"></small></div><div class="c"><button class="toggle" role="switch" data-k="power.keep_awake"></button></div></div>
      <div class="r only-mac"><div class="t"><span data-i18n="g.ac"></span><small data-i18n="g.ac_note"></small></div><div class="c"><button class="toggle" role="switch" data-k="power.ac_only"></button></div></div>
      <div class="r only-win" id="s0Row" hidden><div class="t"><span data-i18n="g.s0"></span><small data-i18n="g.s0_note"></small></div><div class="c"><span class="status muted"><span class="dot"></span><span data-i18n="st.avoided"></span></span></div></div>
    </div>
    <div class="group-label"><span data-i18n="g.cfg_label"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span class="mono xs path" id="cfgPath"></span><small data-i18n="g.cfg_note"></small></div><div class="c"><button class="btn" id="reveal" data-i18n="g.reveal"></button></div></div>
    </div>
  </section>

  <!-- 息屏 -->
  <section id="blank">
    <h1 data-i18n="b.title"></h1>
    <p class="lead" data-i18n="b.lead"></p>
    <div class="group-label"><span data-i18n="b.off_label"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="b.displays"></span><small data-i18n="b.displays_note"></small></div><div class="c"><span class="status muted"><span class="dot ok"></span><span data-i18n="st.always_off"></span></span></div></div>
      <div class="r"><div class="t"><span data-i18n="b.kbd"></span><small id="kbdNote" data-i18n="b.kbd_note"></small></div><div class="c"><button class="toggle" role="switch" data-k="lights.keyboard_backlight" id="kbdToggle"></button></div></div>
      <div class="r"><div class="t"><span><span data-i18n="b.rgb"></span> <span class="soon" data-i18n="soon.later"></span></span><small><span data-i18n="b.rgb_note"></span> · <span class="mono" id="rgbHost"></span></small></div><div class="c"><button class="toggle" role="switch" disabled></button></div></div>
    </div>
    <div class="group-label"><span data-i18n="b.mon_label"></span><span class="faint" id="monCount"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="b.scope"></span><small data-i18n="b.scope_note"></small></div><div class="c"><div class="seg w220" data-k="display.mode"><button data-v="all" data-i18n="b.all"></button><button data-v="selected" data-i18n="b.selected"></button></div></div></div>
      <div id="monitors"></div>
      <div class="r note" id="ddcHint" hidden><small data-i18n="b.ddc_hint"></small></div>
      <div class="r" id="keepRow"><div class="t"><span data-i18n="b.keep"></span><small id="keepNote"></small></div><div class="c"><button class="toggle" role="switch" data-k="display.keep_input" id="keepToggle" data-i18n-aria="b.keep"></button></div></div>
      <div class="r"><div class="t"><span data-i18n="b.method"></span><small id="methodNote"></small></div><div class="c"><span class="select"><select data-k="display.method"><option value="auto" data-i18n="b.method_auto"></option><option value="power_off" data-i18n="b.method_power"></option><option value="overlay" data-i18n="b.method_overlay"></option></select></span></div></div>
    </div>
    <div class="group-label"><span data-i18n="b.lit_label"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="b.reblank"></span><small data-i18n="b.reblank_note"></small></div><div class="c"><span class="field" data-num="wake.reblank_after_s" data-min="1" data-max="60"><input type="number" min="1" max="60"><i data-i18n="b.after_unit"></i><span class="step"><button data-d="1">▲</button><button data-d="-1">▼</button></span></span></div></div>
    </div>
  </section>

  <!-- 唤醒 -->
  <section id="wake">
    <h1 data-i18n="w.title"></h1>
    <p class="lead" data-i18n="w.lead"></p>
    <div class="group" data-radio="wake.method">
      <div class="r pick" data-v="any_key"><div class="lead-ic"><span class="radio"></span><div class="t"><span data-i18n="w.any"></span><small data-i18n="w.any_note"></small></div></div></div>
      <div class="r pick" data-v="hotkey"><div class="lead-ic"><span class="radio"></span><div class="t"><span data-i18n="w.hotkey"></span></div></div><div class="c"><span class="recorder" data-hk="wake.hotkey"><span class="keys"></span><button class="x" data-i18n="rec.again"></button></span></div></div>
      <div class="r pick" data-v="mouse_move"><div class="lead-ic"><span class="radio"></span><div class="t"><span data-i18n="w.mouse"></span><small data-i18n="w.mouse_note"></small></div></div></div>
      <div class="r pick" data-v="click"><div class="lead-ic"><span class="radio"></span><div class="t"><span data-i18n="w.click"></span><small data-i18n="w.click_note"></small></div></div></div>
      <div class="r pick" data-v="password"><div class="lead-ic"><span class="radio"></span><div class="t"><span data-i18n="w.pw"></span><small data-i18n="w.pw_note"></small></div></div></div>
      <div class="r pick" data-v="schedule_only"><div class="lead-ic"><span class="radio"></span><div class="t"><span data-i18n="w.sched"></span><small data-i18n="w.sched_note"></small></div></div></div>
    </div>
    <div class="group-label"><span data-i18n="w.guard_label"></span></div>
    <div class="group">
      <div class="r" id="holdRow"><div class="t"><span data-i18n="w.hold"></span><small data-i18n="w.hold_note"></small></div><div class="c"><input type="range" class="range" min="0" max="3000" step="100" data-range="wake.hold_ms"><span class="num small holdv" id="holdVal"></span></div></div>
      <div class="r" id="mouseRow"><div class="t"><span data-i18n="w.mouse_acc"></span><small data-i18n="w.mouse_acc_note"></small></div><div class="c">
        <span class="field" data-num="wake.mouse_threshold_px" data-min="20" data-max="2000" data-stepv="10"><input type="number"><i>px</i><span class="step"><button data-d="1">▲</button><button data-d="-1">▼</button></span></span>
        <span class="small muted" data-i18n="w.in"></span>
        <span class="field" data-num="wake.mouse_window_ms" data-min="100" data-max="5000" data-stepv="100"><input type="number"><i>ms</i><span class="step"><button data-d="1">▲</button><button data-d="-1">▼</button></span></span>
        <span class="small muted" data-i18n="w.inside"></span></div></div>
    </div>
    <div class="group-label"><span data-i18n="w.remote_label"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="w.remote"></span><small data-i18n="w.remote_note"></small></div><div class="c"><button class="toggle" role="switch" data-k="wake.allow_remote" data-i18n-aria="w.remote"></button></div></div>
    </div>
    <div class="group-label"><span data-i18n="w.after_label"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="w.lock"></span><small data-i18n="w.lock_note"></small></div><div class="c"><button class="toggle" role="switch" data-k="wake.lock_on_wake"></button></div></div>
      <div class="r"><div class="t"><span data-i18n="w.em"></span><small data-i18n="w.em_note"></small></div><div class="c"><span class="recorder" data-hk="safety.emergency_hotkey"><span class="keys"></span><button class="x" data-i18n="rec.again"></button></span></div></div>
    </div>
  </section>

  <!-- 定时 -->
  <section id="schedule">
    <h1 data-i18n="s.title"></h1>
    <p class="lead" data-i18n="s.lead"></p>
    <div class="group">
      <div class="r"><div class="t"><span class="with-dot"><span class="dot" id="schedDot"></span><span data-i18n="s.auto"></span></span><small id="schedNext"></small></div><div class="c"><button class="btn ghost" id="skipBtn" hidden data-i18n="s.skip"></button><button class="btn ghost" id="unskipBtn" hidden data-i18n="s.unskip"></button><button class="toggle" role="switch" data-k="schedule.enabled" data-i18n-aria="s.auto"></button></div></div>
      <div class="r col">
        <div class="time-row">
          <div class="big-time"><span class="tp" data-time="schedule.start"><select class="hh" data-i18n-aria="s.start_h"></select><span class="c">:</span><select class="mm" data-i18n-aria="s.start_m"></select></span><span class="a">→</span><span class="tp" data-time="schedule.end"><select class="hh" data-i18n-aria="s.end_h"></select><span class="c">:</span><select class="mm" data-i18n-aria="s.end_m"></select></span></div>
          <span class="small muted" id="schedDur"></span>
        </div>
        <div>
          <div class="track" id="track"></div>
          <div class="track-labels"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
        </div>
      </div>
      <div class="r"><div class="t"><span data-i18n="s.repeat"></span><small data-i18n="s.repeat_note"></small></div><div class="c"><div class="days" id="days"></div></div></div>
    </div>
    <div class="group-label"><span data-i18n="s.before_label"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="s.remind"></span><small data-i18n="s.remind_note"></small></div><div class="c"><span class="select"><select data-k="schedule.remind_before_min" data-type="num"><option value="0" data-i18n="s.remind_0"></option><option value="1" data-i18n="s.remind_n" data-n="1"></option><option value="5" data-i18n="s.remind_n" data-n="5"></option><option value="10" data-i18n="s.remind_n" data-n="10"></option><option value="15" data-i18n="s.remind_n" data-n="15"></option><option value="30" data-i18n="s.remind_n" data-n="30"></option></select></span></div></div>
      <div class="r"><div class="t"><span data-i18n="s.fs"></span><small data-i18n="s.fs_note"></small></div><div class="c"><button class="toggle" role="switch" data-k="schedule.skip_when_fullscreen_video"></button></div></div>
    </div>
  </section>

  <!-- 关于与诊断 -->
  <section id="about">
    <div class="about-head">
      <div><h1><span data-i18n="a.name"></span> <span class="num muted ver" id="ver"></span></h1><div class="small muted sub" data-i18n="a.sub"></div></div>
      <div class="links"><button class="btn ghost" data-link="site" data-i18n="a.site"></button><button class="btn ghost" data-link="github">GitHub</button></div>
    </div>
    <div class="group-label"><span data-i18n="a.upd_label"></span></div>
    <div class="group">
      <div class="r"><div class="t"><span id="updText"></span><small id="updNote"></small></div>
        <div class="c"><button class="btn ghost" id="updNotes" data-link="releases" data-i18n="a.upd_notes" hidden></button><button class="btn" id="updCheck" data-i18n="a.upd_check"></button><button class="btn primary" id="updInstall" data-i18n="a.upd_install" hidden></button></div></div>
      <div class="r"><div class="t"><span data-i18n="g.upd"></span><small data-i18n="g.upd_note"></small></div><div class="c"><button class="toggle" role="switch" data-k="general.check_updates"></button></div></div>
    </div>
    <div id="permBlock" hidden>
      <div class="group-label"><span data-i18n="a.perm_label"></span></div>
      <div class="group">
        <div class="r"><div class="t"><span data-i18n="a.ax"></span><small data-i18n="a.ax_note"></small></div><div class="c" id="permAx"></div></div>
        <div class="r"><div class="t"><span data-i18n="a.in"></span><small data-i18n="a.in_note"></small></div><div class="c" id="permIn"></div></div>
      </div>
    </div>
    <div class="group-label"><span data-i18n="a.caps_label"></span></div>
    <div class="group" id="caps"></div>
    <div class="group-label"><span data-i18n="a.hist_label"></span><button class="btn ghost mini" id="histClear" data-i18n="a.hist_clear" hidden></button></div>
    <div class="group hist" id="hist"><div class="r"><div class="t"><small data-i18n="a.hist_none"></small></div></div></div>
    <div class="group">
      <div class="r"><div class="t"><span data-i18n="a.export"></span><small data-i18n="a.export_note"></small></div><div class="c"><button class="btn" id="exportDiag" data-i18n="a.export_btn"></button></div></div>
    </div>
  </section>

  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="common.js"></script>
<script src="settings.js"></script>
</body></html>
