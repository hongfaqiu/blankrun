<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title data-i18n="title.onboarding">BlankRun</title>
<link rel="stylesheet" href="nb.css"><link rel="stylesheet" href="onboarding.css">
</head>
<body>
<div class="window">
  <div class="content">
    <div class="mark" aria-hidden="true"></div>
    <h1 class="nl" data-i18n="ob.h1"></h1>
    <p class="lead"><span data-i18n="ob.lead_a"></span><span class="keys" id="wakeKeys"></span><span data-i18n="ob.lead_b"></span></p>

    <div class="step">
      <span class="n">1</span>
      <div class="t"><b data-i18n="a.ax"></b><small data-i18n="a.ax_note"></small></div>
      <div class="c" id="s1"></div>
    </div>
    <div class="step">
      <span class="n">2</span>
      <div class="t"><b data-i18n="a.in"></b><small data-i18n="ob.in_note"></small></div>
      <div class="c" id="s2"></div>
    </div>
    <p class="note nl" data-i18n="ob.note"></p>
  </div>
  <div class="foot">
    <button class="btn ghost skip" id="skip" data-i18n="ob.skip"></button>
    <span class="foot-r"><span class="wait"><span class="dot" id="doneDot"></span><span id="doneText"></span></span><button class="btn" id="done" disabled data-i18n="ob.done"></button></span>
  </div>
</div>
<script src="common.js"></script>
<script src="onboarding.js"></script>
</body></html>
