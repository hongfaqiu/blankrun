<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>NightBlank</title>
<link rel="stylesheet" href="nb.css"><link rel="stylesheet" href="popover.css">
</head>
<body>
<div class="pop">
  <div class="head">
    <span class="name">NightBlank</span>
    <span class="state"><span class="dot" id="stDot"></span><span id="stText">待命 · 未在防睡眠</span></span>
  </div>

  <div class="sec">
    <button class="blank-btn" id="blankBtn">
      <div><div class="label">立即息屏</div><div class="sub" id="blankSub">关掉显示器，电脑保持运行</div></div>
      <span class="led"></span>
    </button>
    <div class="blank-btn counting" id="countBox" hidden>
      <div><div class="count num" id="count">0:00</div><div class="sub">后息屏 · 电脑会保持运行</div></div>
      <button class="btn cancel" id="cancelBtn">取消</button>
      <span class="led on"></span>
    </div>
    <div class="delay">
      <span class="small faint">延迟</span>
      <div class="seg" id="delay">
        <button data-s="0">立即</button><button data-s="60">1 分钟</button><button data-s="300">5 分钟</button><button data-s="900">15 分钟</button>
      </div>
    </div>
  </div>
  <hr>

  <div class="sec">
    <div class="row">
      <span class="small plan-label"><span class="dot" id="planDot"></span>今晚的计划</span>
      <button class="toggle" role="switch" id="planToggle" aria-label="按计划自动息屏"></button>
    </div>
    <div class="row baseline">
      <div class="plan-time num" id="planTime">23:30<span class="arrow">→</span>07:30</div>
      <span class="small muted" id="planWhen"></span>
    </div>
    <div class="track" id="track"></div>
    <div class="track-labels"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
  </div>
  <hr>

  <div class="sec">
    <dl class="kv">
      <dt>唤醒</dt>
      <dd><span id="wakeText"></span><button class="faint xs link" data-open="wake">更改</button></dd>
      <dt>关闭</dt>
      <dd><span id="offText"></span></dd>
      <dt>紧急</dt>
      <dd><span class="muted"><span class="keys" id="emKeys"></span>&nbsp;随时恢复</span></dd>
    </dl>
  </div>
  <hr>

  <div class="menu">
    <button id="openSettings"><span>设置…</span><span class="mono only-mac">⌘,</span></button>
    <button id="quitBtn"><span>退出 NightBlank</span><span class="mono only-mac">⌘Q</span></button>
  </div>
</div>
<script src="common.js"></script>
<script src="popover.js"></script>
</body></html>
