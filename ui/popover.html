<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title data-i18n="title.popover">BlankRun</title>
<link rel="stylesheet" href="nb.css"><link rel="stylesheet" href="popover.css">
</head>
<body>
<div class="pop">
  <div class="head">
    <span class="name" data-i18n="app.name"></span>
    <span class="head-r"><span class="state"><span class="dot" id="stDot"></span><span id="stText"></span></span><button class="close" id="closeBtn" data-i18n-aria="p.close">×</button></span>
  </div>

  <div class="sec">
    <button class="blank-btn" id="blankBtn">
      <div><div class="label" data-i18n="p.blank_now"></div><div class="sub" id="blankSub"></div></div>
      <span class="led"></span>
    </button>
    <div class="blank-btn counting" id="countBox" hidden>
      <div><div class="count num" id="count">0:00</div><div class="sub" data-i18n="p.count_sub"></div></div>
      <button class="btn cancel" id="cancelBtn" data-i18n="p.cancel"></button>
      <span class="led on"></span>
    </div>
    <div class="delay">
      <span class="small faint" data-i18n="p.delay"></span>
      <div class="seg" id="delay">
        <button data-s="0" data-i18n="p.now"></button><button data-s="60" data-i18n="p.min" data-n="1"></button><button data-s="300" data-i18n="p.min" data-n="5"></button><button data-s="900" data-i18n="p.min" data-n="15"></button>
      </div>
    </div>
  </div>
  <hr>

  <div class="sec">
    <div class="row">
      <span class="small plan-label"><span class="dot" id="planDot"></span><span data-i18n="p.plan"></span></span>
      <button class="toggle" role="switch" id="planToggle" data-i18n-aria="p.plan_aria"></button>
    </div>
    <div class="row baseline">
      <button class="plan-time num" id="planTime" data-i18n-aria="p.plan_edit">23:30<span class="arrow">→</span>07:30</button>
      <span class="small muted" id="planWhen"></span>
    </div>
    <div class="track" id="track"></div>
    <div class="track-labels"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
  </div>
  <hr>

  <div class="sec">
    <dl class="kv">
      <dt data-i18n="p.wake"></dt>
      <dd><span id="wakeText"></span><button class="faint xs link" data-open="wake" data-i18n="p.change"></button></dd>
      <dt data-i18n="p.off"></dt>
      <dd><span id="offText"></span></dd>
      <dt data-i18n="p.em"></dt>
      <dd><span class="muted"><span class="keys" id="emKeys"></span>&nbsp;<span data-i18n="p.em_any"></span></span></dd>
    </dl>
    <div class="guard" id="guard" hidden><span id="guardText"></span><button class="link xs" id="guardFix" data-i18n="p.guard_fix"></button></div>
  </div>
  <hr>

  <div class="upd" id="updRow" hidden><span class="upd-l"><span class="dot standby"></span><span id="updText"></span></span><button class="lnk" id="updNotes" data-i18n="p.upd_notes"></button><button class="btn mini" id="updGo" data-i18n="p.upd_install"></button></div>
  <div class="menu">
    <button id="openSettings" class="m-set"><svg class="ico" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" d="M6.9 1.8h2.2l.35 1.7 1.15.66 1.65-.55 1.1 1.9-1.3 1.15v1.33l1.3 1.15-1.1 1.9-1.65-.55-1.15.66-.35 1.7H6.9l-.35-1.7-1.15-.66-1.65.55-1.1-1.9 1.3-1.15V6.67L2.65 5.5l1.1-1.9 1.65.55 1.15-.66z"/><circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span data-i18n="p.settings"></span><span class="mono only-mac">⌘,</span></button>
    <button id="quitBtn" class="m-quit"><span data-i18n="p.quit"></span><span class="mono only-mac">⌘Q</span></button>
  </div>
</div>
<script src="common.js"></script>
<script src="popover.js"></script>
</body></html>
