[package]
name = "blankrun"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "blankrun"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = [] }

[dependencies]
blankrun-core = { path = "../crates/core" }
# 只开必要特性：wry(WebView) + 托盘 + 资源压缩。不开 devtools 等。
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "compression", "common-controls-v6"] }
# 以下都已经是 tauri 的传递依赖，不增加体积
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自动更新：用系统 TLS（Mac Security.framework / Windows SChannel），不带 rustls、zip，体积最小
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# windows-sys 比 windows crate 轻（仅 FFI 声明），按需开 feature
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemServices",
  "Win32_System_SystemInformation", "Win32_System_Shutdown", "Win32_Globalization", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell",
] }

# macOS：不引入 objc2 / core-graphics，platform/macos.rs 手写少量 FFI，保持依赖最小
