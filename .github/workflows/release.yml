name: Release

# 只编译一次：
# 1. 在 main 上改好版本号（Cargo.toml / Cargo.lock / tauri.conf.json）后，手动运行本工作流（workflow_dispatch）。
#    build job 编译、签名、公证，把 DMG / NSIS / 自动更新包和它们的 .sig 上传成 artifact。
# 2. 构建成功后，在同一个 commit 上推 v* 标签。release job 不再编译：它找到这个 commit 上最近一次成功的
#    workflow_dispatch 运行，下载它的 artifact，核对版本号，生成 latest.json 并发布 GitHub Release。
#    找不到就失败，提示先跑验证构建。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize_dmg:
        description: "Also notarize + staple the DMG (the app inside is always notarized + stapled)"
        type: boolean
        default: false

# DMG 默认不单独公证（苹果公证一次要 ~1 小时，runner 等太久容易断网）；里面的 .app 始终公证 + staple，DMG 仍用 Developer ID 签名。
# 要公证 DMG：手动运行时勾选 notarize_dmg，或把仓库变量 NOTARIZE_DMG 设为 true
env:
  NOTARIZE_DMG: ${{ inputs.notarize_dmg && 'true' || vars.NOTARIZE_DMG || 'false' }}

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            name: windows-x64
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis
            bundle: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version numbers
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tauri_ver=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          echo "Cargo.toml: $cargo_ver, tauri.conf.json: $tauri_ver, commit: $GITHUB_SHA"
          [ "$cargo_ver" = "$tauri_ver" ] || { echo "::error::version mismatch: Cargo.toml $cargo_ver vs tauri.conf.json $tauri_ver"; exit 1; }

      - name: Core tests
        run: cargo test -p blankrun-core

      # macOS 签名 + 公证（Developer ID）。所有 Apple 相关 secrets 都是可选的：
      # - 没有证书：保持 tauri.conf.json 里的 ad-hoc 签名（"-"），和以前一样出未签名包，发布不失败
      # - 有证书、没有公证凭据：Developer ID 签名，但跳过公证（tauri 只给 warning）
      # - 有证书 + 公证凭据：签名 + 公证 + staple。优先 App Store Connect API key，其次 Apple ID + App 专用密码
      # 注意：只把非空的值写进 $GITHUB_ENV。直接在 env: 里写 ${{ secrets.X }} 时，缺失的 secret 会变成空字符串，
      # tauri 会把空的 APPLE_SIGNING_IDENTITY / APPLE_ID 当成"已提供"而报错。
      - name: Prepare macOS signing & notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::warning title=macOS unsigned::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD not set, building with ad-hoc signature (not notarized)"
            exit 0
          fi

          # 证书导入临时 keychain（job 结束时删除）
          keychain="$RUNNER_TEMP/blankrun-signing.keychain-db"
          kc_pass="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 32)}"
          echo "::add-mask::$kc_pass"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          # 放进搜索列表，codesign 按名字就能找到证书
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '"' | sed 's/^ *//')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"

          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"' || true)
          if [ -z "$identity" ]; then
            echo "::error title=macOS signing::No 'Developer ID Application' identity found in APPLE_CERTIFICATE (need the Developer ID Application cert + private key exported as .p12)"
            exit 1
          fi
          echo "Signing identity: $identity"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "BLANKRUN_KEYCHAIN=$keychain"
            echo "BLANKRUN_SIGNED=1"
          } >> "$GITHUB_ENV"

          # 公证凭据：优先 App Store Connect API key
          if [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_PRIVATE_KEY:-}" ]; then
            key_dir="$RUNNER_TEMP/private_keys"
            mkdir -p "$key_dir"
            key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
            chmod 600 "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
              echo "BLANKRUN_NOTARIZE=api-key"
            } >> "$GITHUB_ENV"
            echo "Notarization: App Store Connect API key"
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              echo "BLANKRUN_NOTARIZE=apple-id"
            } >> "$GITHUB_ENV"
            echo "Notarization: Apple ID + app-specific password"
          else
            echo "::warning title=macOS not notarized::Signed with Developer ID but no notarization credentials (APPLE_API_* or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID); Gatekeeper will still warn"
          fi

      # 不传 tagName：tauri-action 只负责构建，发布由下面的 release job 统一处理
      # 自动更新包的 minisign 签名（私钥只在仓库 secrets 里）
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: npx --yes @tauri-apps/cli@^2
          args: ${{ matrix.args }}

      # tauri 只公证并 staple .app；DMG 只签名不公证。这里再把 DMG 也公证 + staple，
      # 这样离线首次打开 DMG 也不会被 Gatekeeper 拦（失败不阻断发布：里面的 .app 已经 staple 过了）
      # tauri 只公证并 staple .app；DMG 只签名不公证。这里再把 DMG 也公证 + staple，
      # 这样离线首次打开 DMG 也不会被 Gatekeeper 拦。
      # 公证被拒（Invalid/Rejected）→ 失败；runner 断网（NSURLErrorDomain -1009 等）重试后仍不行 → 只给 warning
      #（里面的 .app 已经由 tauri 公证 + staple，用户打开不受影响）
      - name: Notarize & staple DMG
        if: runner.os == 'macOS' && env.BLANKRUN_NOTARIZE != '' && env.NOTARIZE_DMG == 'true'
        run: |
          # GitHub 默认用 bash -e 跑脚本：这里关掉 -e，自己判断每条命令的结果（网络错误要重试/降级成 warning，不能直接退出）
          set +e -uo pipefail
          dmg=$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          if [ "$BLANKRUN_NOTARIZE" = "api-key" ]; then
            auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          json() { python3 -c 'import json,sys
          try: print(json.load(sys.stdin).get(sys.argv[1],""))
          except Exception: print("")' "$1"; }
          id=""
          for i in 1 2 3; do
            out=$(xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json) && id=$(printf '%s' "$out" | json id)
            [ -n "$id" ] && break
            echo "notarytool submit failed (attempt $i): $out"; sleep 30
          done
          if [ -z "$id" ]; then echo "::warning title=DMG not notarized::could not submit DMG (network?); the app inside is notarized and stapled"; exit 0; fi
          echo "DMG submission id: $id"
          status=""
          for i in 1 2 3 4 5 6; do
            res=$(xcrun notarytool wait "$id" "${auth[@]}" --timeout 90m --output-format json)
            status=$(printf '%s' "$res" | json status)
            case "$status" in Accepted|Invalid|Rejected) break;; esac
            echo "notarytool wait returned '$status' (attempt $i): $res"; sleep 30
          done
          echo "DMG notarization status: $status"
          case "$status" in
            Accepted) ;;
            Invalid|Rejected)
              xcrun notarytool log "$id" "${auth[@]}" || true
              echo "::error title=DMG notarization::Apple rejected the DMG ($status)"; exit 1;;
            *) echo "::warning title=DMG notarization::status unknown after retries (network?), DMG not stapled; the app inside is notarized and stapled"; exit 0;;
          esac
          stapled=""
          for i in 1 2 3; do xcrun stapler staple "$dmg" && { stapled=1; break; }; echo "staple failed (attempt $i), retrying in 30s"; sleep 30; done
          if [ -z "$stapled" ]; then echo "::warning title=DMG staple::stapler staple failed after retries (network?)"; exit 0; fi
          for i in 1 2 3; do xcrun stapler validate "$dmg" && exit 0; echo "validate failed (attempt $i), retrying in 30s"; sleep 30; done
          echo "::warning title=DMG validate::stapler validate failed after retries (network?)"

      # 签名身份不对 / 没有 hardened runtime / 不是 universal → 失败；
      # stapler validate、spctl 要联网，runner 断网时重试 3 次（间隔 30s），网络类错误最终只给 warning
      - name: Check macOS app (signature, notarization, architectures)
        if: runner.os == 'macOS'
        run: |
          # GitHub 默认用 bash -e 跑脚本：这里关掉 -e，自己判断每条命令的结果（网络错误要重试/降级成 warning，不能直接退出）
          set +e -uo pipefail
          app=target/universal-apple-darwin/release/bundle/macos/BlankRun.app
          codesign --verify --deep --strict --verbose=2 "$app" || exit 1
          info=$(codesign -dv --verbose=4 "$app" 2>&1)
          printf '%s\n' "$info" | grep -E "Signature|Identifier|Authority|TeamIdentifier|flags|Runtime"
          lipo -info "$app/Contents/MacOS/blankrun"
          lipo "$app/Contents/MacOS/blankrun" -verify_arch arm64 x86_64 || { echo "::error::not a universal binary"; exit 1; }
          if [ -n "${BLANKRUN_SIGNED:-}" ]; then
            printf '%s\n' "$info" | grep -qxF "Authority=$APPLE_SIGNING_IDENTITY" || { echo "::error title=macOS signing::app is not signed with $APPLE_SIGNING_IDENTITY"; exit 1; }
            printf '%s\n' "$info" | grep -q 'flags=.*runtime' || { echo "::error title=macOS signing::hardened runtime missing"; exit 1; }
            dmg=$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
            codesign -dv --verbose=4 "$dmg" 2>&1 | grep -qxF "Authority=$APPLE_SIGNING_IDENTITY" || { echo "::error title=macOS signing::DMG is not signed with $APPLE_SIGNING_IDENTITY"; exit 1; }
            echo "Signed with: $APPLE_SIGNING_IDENTITY (app + DMG)"
          fi
          if [ -n "${BLANKRUN_NOTARIZE:-}" ]; then
            netre='NSURLErrorDomain|-1009|offline|timed out|network|CloudKit|Could not connect'
            run_check() {  # $1 = 名字，其余 = 命令；网络错误重试 3 次后只 warning，其他错误失败
              local name=$1; shift; local out
              for i in 1 2 3; do
                if out=$("$@" 2>&1); then printf '%s\n' "$out"; return 0; fi
                printf '%s\n' "$out"
                if ! printf '%s' "$out" | grep -qiE "$netre"; then echo "::error title=$name::$name failed"; return 1; fi
                echo "$name: network error (attempt $i), retrying in 30s"; sleep 30
              done
              echo "::warning title=$name::$name could not reach Apple after 3 attempts (runner network), not failing the build"
            }
            run_check "stapler validate" xcrun stapler validate "$app" || exit 1
            run_check "spctl" spctl --assess --type execute --verbose=4 "$app" || exit 1
          elif [ -n "${BLANKRUN_SIGNED:-}" ]; then
            echo "Developer ID signed, not notarized"
          else
            echo "Ad-hoc signed (no APPLE_CERTIFICATE secret)"
          fi

      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${BLANKRUN_KEYCHAIN:-}" ]; then security delete-keychain "$BLANKRUN_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/certificate.p12"

      - name: Show bundle sizes
        shell: bash
        run: ls -l $(echo "${{ matrix.bundle }}")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不编译：用同一 commit 上已经验证过的构建产物
      - name: Download artifacts from the verified build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          ver="${TAG#v}"
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tauri_ver=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          if [ "$ver" != "$cargo_ver" ] || [ "$ver" != "$tauri_ver" ]; then
            echo "::error title=Version mismatch::tag $TAG but Cargo.toml=$cargo_ver tauri.conf.json=$tauri_ver at $sha"; exit 1
          fi
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$sha&event=workflow_dispatch&status=success&per_page=20" \
            -q '[.workflow_runs[] | select(.head_sha == "'"$sha"'" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$run_id" ]; then
            echo "::error title=No verified build::No successful workflow_dispatch run of release.yml for commit $sha. Run the Release workflow on this commit (Actions › Release › Run workflow) first, wait for it to succeed, then push the tag again."
            exit 1
          fi
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" -q .head_sha)
          [ "$run_sha" = "$sha" ] || { echo "::error::run $run_id head_sha $run_sha != $sha"; exit 1; }
          echo "Using build run $run_id ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id) for $sha"
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -D dist -n macos-universal -n windows-x64
          find dist -type f | sort
          # 版本号核对：产物文件名里的版本必须等于标签
          for f in "BlankRun_${ver}_universal.dmg" "BlankRun_${ver}_x64-setup.exe" "BlankRun_${ver}_x64-setup.exe.sig" BlankRun.app.tar.gz BlankRun.app.tar.gz.sig; do
            [ -n "$(find dist -type f -name "$f")" ] || { echo "::error title=Missing artifact::$f not found in run $run_id (artifacts must be version $ver)"; exit 1; }
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 多个路径的产物上传后会保留子目录（dmg/、macos/），先摊平
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          # 再附一份不带版本号的副本，官网用 releases/latest/download/<名字> 固定链接下载最新版
          for f in dist/*_universal.dmg; do cp "$f" dist/BlankRun_universal.dmg; done
          for f in dist/*_x64-setup.exe; do cp "$f" dist/BlankRun_x64-setup.exe; done
          # 自动更新：Mac 的 .app.tar.gz 改成带版本号的名字，再生成 latest.json（App 从 releases/latest/download/latest.json 读）
          ver="${TAG#v}"
          mv dist/BlankRun.app.tar.gz "dist/BlankRun_${ver}_universal.app.tar.gz"
          mv dist/BlankRun.app.tar.gz.sig "dist/BlankRun_${ver}_universal.app.tar.gz.sig"
          python3 - "$TAG" "$ver" <<'PY'
          import json, sys, glob, datetime
          tag, ver = sys.argv[1], sys.argv[2]
          base = f"https://github.com/hongfaqiu/blankrun/releases/download/{tag}/"
          sig = lambda f: open(f + ".sig").read().strip()
          mac = f"dist/BlankRun_{ver}_universal.app.tar.gz"
          win = glob.glob(f"dist/BlankRun_{ver}_x64-setup.exe")[0]
          m = {"url": base + mac[5:], "signature": sig(mac)}
          w = {"url": base + win[5:], "signature": sig(win)}
          out = {"version": ver, "notes": f"https://github.com/hongfaqiu/blankrun/releases/tag/{tag}",
                 "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "platforms": {"darwin-aarch64": m, "darwin-x86_64": m, "windows-x86_64": w}}
          json.dump(out, open("dist/latest.json", "w"), indent=2)
          PY
          cat dist/latest.json
          ls -l dist
          notes=".github/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=".github/release-notes/${TAG#v}.md"
          [ -f "$notes" ] || notes=/dev/null
          pre="--latest"; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/* --title "BlankRun · 黑着跑 ${TAG}" --notes-file "$notes" $pre --verify-tag
