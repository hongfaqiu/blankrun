name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows-x64
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis
            bundle: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Core tests
        run: cargo test -p blankrun-core

      # 不传 tagName：tauri-action 只负责构建，发布由下面的 release job 统一处理
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          tauriScript: npx --yes @tauri-apps/cli@^2
          args: ${{ matrix.args }}

      - name: Check macOS app (ad-hoc signature, architectures)
        if: runner.os == 'macOS'
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/BlankRun.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
          lipo -info "$app/Contents/MacOS/blankrun"

      - name: Show bundle sizes
        shell: bash
        run: ls -l ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          notes=".github/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=".github/release-notes/${TAG#v}.md"
          [ -f "$notes" ] || notes=/dev/null
          pre="--latest"; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/* --title "BlankRun 息屏跑 ${TAG}" --notes-file "$notes" $pre --verify-tag
