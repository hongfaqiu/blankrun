<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>黑着跑 · 菜单栏面板</title>
<link rel="stylesheet" href="nb.css">
<style>
.stage{position:relative;width:440px;height:560px;overflow:hidden;background:var(--desk)}
.win .stage{height:600px}
.pop{position:absolute;right:12px;top:36px;width:320px;background:var(--paper);border:1px solid var(--frame);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.win .pop{top:auto;bottom:58px;border-radius:8px;background:var(--card);border-color:var(--frame)}
.sec{padding:14px 16px}
.head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.head .name{font-weight:600;font-size:13px}
.state{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.delay{display:flex;align-items:center;gap:10px;margin-top:10px}
.delay .seg{flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.plan-time{font:500 20px var(--mono);letter-spacing:-.02em;margin-top:6px}
.plan-time .arrow{color:var(--ink3);font-size:15px;margin:0 4px}
.kv{display:grid;grid-template-columns:56px 1fr;row-gap:8px;font-size:12px;align-items:center}
.kv dt{color:var(--ink3)} .kv dd{margin:0;display:flex;align-items:center;gap:6px;justify-content:space-between}
.menu{padding:5px}
.menu div{display:flex;justify-content:space-between;align-items:center;height:28px;padding:0 11px;border-radius:6px}
.menu div:first-child{background:var(--hover)}
.menu .mono{color:var(--ink3);font-size:11px}
.count{font:500 26px var(--mono);letter-spacing:-.02em}
.mac .only-win,.win .only-mac{display:none!important}
body:not(.countdown) .st-count,.countdown .st-idle{display:none!important}
</style></head>
<body>
<div class="stage">
  <div class="menubar only-mac">
    <span class="muted">⌕</span><span>周四 20:43</span>
    <span class="tray"><svg width="18" height="14" viewBox="0 0 18 14" fill="none"><rect x="1" y="1" width="16" height="10.5" rx="1.8" stroke="currentColor" stroke-width="1.5"/><circle cx="13.6" cy="8.4" r="1.3" fill="currentColor"/></svg></span>
  </div>

  <div class="pop">
    <div class="head">
      <span class="name">黑着跑</span>
      <span class="state st-idle"><span class="dot"></span>待命 · 未在防睡眠</span>
      <span class="state st-count"><span class="dot" style="background:var(--ink)"></span>倒计时中 · 已开始防睡眠</span>
    </div>

    <div class="sec">
      <div class="blank-btn st-idle">
        <div><div class="label">立即息屏</div><div class="sub only-mac">关掉 2 台显示器和键盘背光，电脑保持运行</div><div class="sub only-win">关掉 2 台显示器，电脑保持运行</div></div>
        <span class="led"></span>
      </div>
      <div class="blank-btn st-count">
        <div><div class="count">4:32</div><div class="sub">后息屏 · 电脑会保持运行</div></div>
        <span class="btn" style="height:28px;background:transparent;border-color:rgba(255,255,255,.22);color:#fff;box-shadow:none">取消</span>
        <span class="led on"></span>
      </div>
      <div class="delay">
        <span class="small faint">延迟</span>
        <div class="seg st-idle"><span class="on">立即</span><span>1 分钟</span><span>5 分钟</span><span>15 分钟</span></div>
        <div class="seg st-count"><span>立即</span><span>1 分钟</span><span class="on">5 分钟</span><span>15 分钟</span></div>
      </div>
    </div>
    <hr>

    <div class="sec">
      <div class="row">
        <span class="small" style="display:flex;align-items:center;gap:6px"><span class="dot standby"></span>今晚的计划</span>
        <span class="toggle on"></span>
      </div>
      <div class="row" style="align-items:baseline">
        <div class="plan-time">23:30<span class="arrow">→</span>07:30</div>
        <span class="small muted">2 小时 47 分后开始</span>
      </div>
      <div class="track" style="margin-top:10px">
        <span class="band" style="left:97.9%;right:0;border-radius:0 3px 3px 0"></span>
        <span class="band" style="left:0;width:31.25%;border-radius:3px 0 0 3px"></span>
        <span class="now" style="left:86.3%"></span>
      </div>
      <div class="track-labels"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
    </div>
    <hr>

    <div class="sec">
      <dl class="kv" style="margin:0">
        <dt>唤醒</dt>
        <dd><span>按住 <span class="keys only-mac"><span class="kbd">⌃</span><span class="kbd">⌥</span><span class="kbd">W</span></span><span class="keys only-win"><span class="kbd">Ctrl</span><span class="kbd">Alt</span><span class="kbd">W</span></span> 1 秒</span><span class="faint xs">更改</span></dd>
        <dt>关闭</dt>
        <dd><span class="only-mac">2 台显示器 · 键盘背光</span><span class="only-win">2 台显示器</span></dd>
        <dt>紧急</dt>
        <dd><span class="muted"><span class="keys only-mac"><span class="kbd">⌃</span><span class="kbd">⌥</span><span class="kbd">⇧</span><span class="kbd">esc</span></span><span class="mono only-win">Ctrl+Alt+Shift+Esc</span>&nbsp;随时恢复</span></dd>
      </dl>
    </div>
    <hr>

    <div class="menu">
      <div><span>设置…</span><span class="mono only-mac">⌘,</span></div>
      <div><span>退出黑着跑</span><span class="mono only-mac">⌘Q</span></div>
    </div>
  </div>

  <div class="taskbar only-win">
    <span class="muted">^</span>
    <span class="tray"><svg width="18" height="14" viewBox="0 0 18 14" fill="none"><rect x="1" y="1" width="16" height="10.5" rx="1.8" stroke="currentColor" stroke-width="1.5"/><circle cx="13.6" cy="8.4" r="1.3" fill="currentColor"/></svg></span>
    <span>中</span>
    <span class="clock">20:43<br>2026/10/15</span>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search);
document.body.classList.add(q.get('p')||'mac'); if(q.get('state')) document.body.classList.add(q.get('state'));
</script>
</body></html>
